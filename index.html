<script>
  // Applied before first paint so an explicit choice never flashes the other theme.
  try {
    var t = localStorage.getItem('cryonirsp_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<body>

<div class="app">

  <!-- ============ MASTHEAD ============ -->
  <header class="masthead">
    <div class="brand" data-nav="landing" role="button" tabindex="0">
      <span class="name">Cryo&#8209;NIRSP Archive</span>
      <span class="eyebrow">DKIST &middot; Haleakal&#257;</span>
    </div>
    <nav>
      <button data-nav="landing">Overview</button>
      <button data-nav="search">Search</button>
      <button class="linkish" id="copyLink">copy link to this search</button>
      <button class="themetoggle" id="themeToggle" aria-label="Switch theme">
        <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.4v2.2M12 19.4v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- ============ LANDING ============ -->
  <main class="landing" id="landing" hidden></main>

  <!-- ============ SEARCH SHELL ============ -->
  <div id="shell" style="display:contents;" hidden>

    <div class="querybar">
      <div class="qfield" onclick="document.getElementById('qinput').focus()">
        <span class="ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </span>
        <span id="tokens" style="display:flex; gap:8px; flex-wrap:wrap;"></span>
        <input id="qinput" type="text" autocomplete="off" spellcheck="false"
               placeholder="dataset id, programme, or a field prefix — line:hei_1083  target:prominence  after:2025-03  r&gt;1.1">
      </div>
      <div class="qhint">
        <span class="keys">
          <span>line:</span><span>target:</span><span>mode:</span><span>stokes:</span><span>after:</span><span>before:</span><span>pa:</span><span>r&gt;</span>
        </span>
        <span>a superseded dataset ID resolves to the product that replaced it</span>
      </div>
    </div>

    <div class="body">
      <aside class="rail" id="rail"></aside>

      <main class="results" id="main">
        <div class="results-head">
          <div class="count" id="count"></div>
          <div class="viewsel">
            <span>view</span>
            <button data-results="table" class="on">table</button>
            <button data-results="grid">grid</button>
          </div>
        </div>
        <div class="chips" id="activeChips"></div>
        <div id="results"></div>
      </main>

      <aside class="aside" id="aside"></aside>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Dataset detail"></div>

<script type="module" src="js/app.js"></script>
</body>
