name: Monthly inventory update

# Rebuilds the archive from the DKIST Data Center once a month and opens a
# pull request with the result. It never pushes to main: the whole point of
# an unattended job is that the abnormal run gets a human in front of it,
# and a PR is where that happens.
#
# The pipeline is incremental. `fetch` skips ASDFs already on disk and
# `enrich` skips products that already carry a structure block, both keyed on
# the inventory JSON that is restored at the start of the run. A typical
# month therefore touches a few dozen products and takes about ten minutes.
# If the state is lost the run still succeeds — it just rebuilds everything,
# which measured around 75 minutes against a 6 hour limit.

on:
  schedule:
    # 06:20 UTC on the 3rd. Not midnight and not the 1st: those are the
    # busiest slots on GitHub's scheduler and get delayed the most.
    - cron: '20 6 3 * *'
  workflow_dispatch:
    inputs:
      recent:
        description: 'Re-enrich the N most recently observed products, to exercise the pipeline against a bounded slice. Leave 0 for a normal incremental run.'
        type: string
        default: '0'
      rebuild:
        description: 'Re-enrich the ENTIRE archive. Roughly five hours of runner time and several runs to finish — use only after a dependency bump.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-inventory
  cancel-in-progress: false

env:
  STATE_TAG: inventory-state
  MEDIA_TAG: media-v2
  # The media release lives in its own repository — 2.5 GB of figures and
  # movies has no business in the site repo's release list. Reading it works
  # with the default token because it is public; UPLOADING to another repo
  # does not, and needs a MEDIA_TOKEN secret with write access there.
  MEDIA_REPO: sr-dash/cryonirsp-media
  MEDIA_SOURCE: https://share.nso.edu/shared/dkist/tschad

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # the enrich budget keeps runs well inside this

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the pipeline
        run: pip install -r tools/inventory/requirements.txt

      # ---------------------------------------------------------------
      # State. The generator's own JSON is what makes the run incremental.
      # It lives as a release asset rather than in git: it is 11 MB and
      # would make every pull request unreviewable, which would defeat the
      # reason we open one.
      # ---------------------------------------------------------------
      - name: Restore inventory state
        if: ${{ !inputs.rebuild }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download "$STATE_TAG" --pattern 'cryonirsp_inventory.json.gz' --clobber; then
            gunzip -f cryonirsp_inventory.json.gz
            python3 -c "import json;d=json.load(open('cryonirsp_inventory.json'));print(f'restored state: {d[\"n_products\"]} products, generated {d[\"generated\"]}')"
          else
            echo "::notice::No saved state. This run will rebuild the archive from scratch."
          fi

      # ---------------------------------------------------------------
      # The pipeline
      # ---------------------------------------------------------------
      - name: Search the Data Center
        run: python3 tools/inventory/cryonirsp-inventory search

      - name: Fetch metadata for new datasets
        run: python3 tools/inventory/cryonirsp-inventory fetch

      # Enrich in chunks against a wall clock, saving state after each one.
      #
      # A shared runner reads ASDFs about five times slower than a laptop —
      # measured at roughly 3 products/min against 15 locally — so a full
      # rebuild of 1,002 does not fit in one job. Chunking means no single
      # run can exceed its budget, and saving state after every chunk means
      # a timeout costs one chunk rather than the whole run. Successive runs
      # pick up exactly where the last stopped, because enrich skips whatever
      # already carries a structure block.
      #
      # A partially enriched archive is a supported state, not a broken one:
      # geometry is tier A-prime in the contract precisely because it arrives
      # later than the rest of the record.
      # Enrich in chunks against a wall clock, saving state after each one.
      #
      # A month brings at most a couple of hundred new datasets, and a shared
      # runner enriches about three a minute, so the normal case is well
      # inside the budget. The budget exists for the abnormal case: it caps
      # what any single run will attempt, and the checkpoint after each chunk
      # means a run that is cut short costs one chunk rather than everything
      # before it.
      #
      # A partially enriched archive is a supported state. Those products
      # appear in the site with everything except pointing geometry, which is
      # why geometry is tier A-prime in the contract.
      - name: Enrich new datasets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENRICH_BUDGET_MIN: 100
          CHUNK: 60
          EXPECTED_MONTHLY_MAX: 200
        run: |
          remaining() {
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('cryonirsp_inventory.json'))
          except Exception:
              print(0); raise SystemExit
          print(sum(1 for p in d['products'].values() if not p.get('structure')))
          PY
          }

          checkpoint() {
            gzip -kf cryonirsp_inventory.json
            gh release view "$STATE_TAG" >/dev/null 2>&1 \
              || gh release create "$STATE_TAG" --title "Inventory state" \
                   --notes "Generator state carried between monthly runs. Not part of the site."
            gh release upload "$STATE_TAG" cryonirsp_inventory.json.gz --clobber
            rm -f cryonirsp_inventory.json.gz
            echo "checkpoint saved"
          }

          RECENT='${{ inputs.recent }}'
          if [ -n "$RECENT" ] && [ "$RECENT" != "0" ]; then
            echo "::notice::Re-enriching the $RECENT most recent products as a bounded test."
            python3 tools/inventory/cryonirsp-inventory enrich --jobs 2 --overwrite --recent "$RECENT"
            checkpoint
            echo "ENRICH_REMAINING=$(remaining)" >> "$GITHUB_ENV"
            exit 0
          fi

          ${{ inputs.rebuild && 'echo "::warning::Full rebuild requested. This takes several runs to complete." && python3 -c "
          import json
          d=json.load(open(\"cryonirsp_inventory.json\"))
          for p in d[\"products\"].values(): p.pop(\"structure\", None)
          json.dump(d, open(\"cryonirsp_inventory.json\",\"w\"))
          print(\"cleared structure on\", len(d[\"products\"]), \"products\")"' || 'true' }}

          backlog=$(remaining)
          if [ "$backlog" -gt "$EXPECTED_MONTHLY_MAX" ]; then
            echo "::warning::$backlog products need enriching, well above the $EXPECTED_MONTHLY_MAX a month should bring. Either the saved state was lost or something changed upstream. This run will do what fits in its budget and checkpoint; it will not silently attempt a full rebuild."
          fi

          deadline=$(( $(date +%s) + ENRICH_BUDGET_MIN * 60 ))
          while :; do
            left=$(remaining)
            echo "::notice::$left products still to enrich"
            [ "$left" -eq 0 ] && { echo "fully enriched"; break; }
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Budget reached with $left products still to do. State is saved; the next run continues from here."
              break
            fi
            python3 tools/inventory/cryonirsp-inventory enrich --jobs 2 --limit "$CHUNK"
            checkpoint
          done

          echo "ENRICH_REMAINING=$(remaining)" >> "$GITHUB_ENV"

      # Observing-day tags come from a third-party summary page. When that
      # page changes shape the tags do not error, they quietly become zero —
      # which is exactly what the delta check refuses to let through.
      - name: Attach observing-day tags
        continue-on-error: true
        run: python3 tools/inventory/cryonirsp-inventory tags

      - name: Report
        run: python3 tools/inventory/cryonirsp-inventory report

      # ---------------------------------------------------------------
      # Media. New observing days bring new figures and movies. The host is
      # not always up, so a failure here must not fail the run — the build
      # simply will not reference media it cannot confirm exists.
      # ---------------------------------------------------------------
      - name: Sync new media into the release
        id: media
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          # Sizes, not just names. The daily figures and movies get
          # regenerated in place — every one of the 84 changed at once
          # earlier this year — and a regenerated file keeps its name, so
          # comparing names alone would never notice.
          gh release view "$MEDIA_TAG" --repo "$MEDIA_REPO" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' | sort > have.txt
          cut -d' ' -f1 have.txt | sort > have-names.txt
          echo "release holds $(wc -l < have-names.txt) assets"

          : > want.txt
          for d in daily_context_figures cn_daily_movies; do
            curl -sS -m 90 --retry 2 "$MEDIA_SOURCE/$d/" \
              | grep -oE 'href="[^"]+\.(jpg|mp4)"' \
              | sed -E "s|href=\"([^\"]+)\"|\1 $d|" >> want.txt
          done
          sort -u want.txt -o want.txt
          echo "source lists $(wc -l < want.txt) assets"

          # A source listing far smaller than what we already have means the
          # host is misbehaving, not that files were withdrawn. Refuse it
          # rather than acting on a bad listing.
          if [ "$(wc -l < want.txt)" -lt "$(( $(wc -l < have-names.txt) / 2 ))" ]; then
            echo "::warning::Source listed $(wc -l < want.txt) assets against $(wc -l < have-names.txt) in the release; ignoring this listing."
            exit 1
          fi

          mkdir -p media
          while read -r f sub; do
            remote=$(curl -sSI -m 60 "$MEDIA_SOURCE/$sub/$f" \
                     | awk 'tolower($1)=="content-length:"{gsub(/\r/,"",$2);print $2}')
            local=$(awk -v n="$f" '$1==n{print $2}' have.txt)
            if [ -n "$local" ] && [ "$remote" = "$local" ]; then continue; fi
            echo "  fetching $f (remote ${remote:-?}, held ${local:-none})"
            curl -sS -m 900 --retry 3 -o "media/$f" "$MEDIA_SOURCE/$sub/$f" || rm -f "media/$f"
          done < want.txt

          n=$(ls media 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            if [ -n "${{ secrets.MEDIA_TOKEN }}" ]; then
              GH_TOKEN='${{ secrets.MEDIA_TOKEN }}' \
                gh release upload "$MEDIA_TAG" --repo "$MEDIA_REPO" media/* --clobber
              echo "uploaded $n new or regenerated assets"
            else
              echo "::warning::$n media files are new or changed, but no MEDIA_TOKEN secret is set, so they cannot be uploaded to $MEDIA_REPO. Those observing days will show as awaiting imagery until the media is synced."
            fi
          else
            echo "media already current"
          fi

          gh release view "$MEDIA_TAG" --repo "$MEDIA_REPO" --json assets --jq '.assets[].name' > media-manifest.txt

      - name: Fall back to the existing media list
        if: steps.media.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::Media sync failed; building against the release as it stands."
          gh release view "$MEDIA_TAG" --repo "$MEDIA_REPO" --json assets --jq '.assets[].name' > media-manifest.txt

      # ---------------------------------------------------------------
      # Build, then judge the result before offering it
      # ---------------------------------------------------------------
      - name: Build the site inventory
        run: |
          cp data/cryonirsp_dataset_details.json /tmp/previous.json
          python3 tools/build_site_inventory.py cryonirsp_inventory.json \
            -o data/cryonirsp_dataset_details.json \
            --media-manifest media-manifest.txt

      - name: Reject JSON the browser cannot parse
        run: node -e "JSON.parse(require('fs').readFileSync('data/cryonirsp_dataset_details.json','utf8'))"

      - name: Validate against the contract
        run: |
          python3 tools/validate_inventory.py data/cryonirsp_dataset_details.json \
            --media-manifest media-manifest.txt --summary-file validate.md

      - name: Check the delta for regressions
        id: delta
        continue-on-error: true
        run: python3 tools/check_delta.py /tmp/previous.json data/cryonirsp_dataset_details.json --summary-file delta.md

      - name: Save inventory state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -kf cryonirsp_inventory.json
          gh release view "$STATE_TAG" >/dev/null 2>&1 \
            || gh release create "$STATE_TAG" --title "Inventory state" \
                 --notes "Generator state carried between monthly runs. Not part of the site."
          gh release upload "$STATE_TAG" cryonirsp_inventory.json.gz --clobber

      - name: Job summary
        if: always()
        run: |
          { cat validate.md 2>/dev/null; cat delta.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY" || true

      # ---------------------------------------------------------------
      # Always a pull request, never a push to main.
      # ---------------------------------------------------------------
      - name: Decide how the pull request should read
        id: pr
        run: |
          if [ "${{ steps.delta.outcome }}" = "success" ]; then
            echo 'title=Monthly inventory refresh' >> "$GITHUB_OUTPUT"
            echo 'verdict=clean' >> "$GITHUB_OUTPUT"
            echo 'note=Counts and vocabularies look like a month of growth. Worth a glance at the numbers before merging.' >> "$GITHUB_OUTPUT"
          fi
          if [ "${ENRICH_REMAINING:-0}" -gt 0 ]; then
            echo "partial=$ENRICH_REMAINING products are not yet enriched, so they carry no pointing geometry. This is a supported state and the next run continues from here." >> "$GITHUB_OUTPUT"
          else
            echo 'title=Monthly inventory refresh — REVIEW: delta check flagged regressions' >> "$GITHUB_OUTPUT"
            echo 'verdict=flagged regressions' >> "$GITHUB_OUTPUT"
            echo 'note=Something regressed enough that this should not be merged without a look — the archive shrank, a vocabulary emptied, coverage collapsed, or dataset ids that used to resolve no longer would.' >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/cryonirsp_dataset_details.json
          branch: inventory/monthly
          delete-branch: true
          commit-message: "Refresh the inventory from the Data Center"
          title: ${{ steps.pr.outputs.title }}
          labels: inventory
          body: |
            Automated rebuild from the DKIST Data Center.

            **Delta check: ${{ steps.pr.outputs.verdict }}**

            ${{ steps.pr.outputs.note }}

            ${{ steps.pr.outputs.partial }}

            Full validation and delta reports are in the [job summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
